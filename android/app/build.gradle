plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.skyrhrg.oceanandroid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.skyrhrg.oceanandroid'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-debug'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
