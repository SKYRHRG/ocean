plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.skyrhrg.oceanandroid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.skyrhrg.oceanandroid'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('OCEAN_KEYSTORE_PATH') ?: "$rootDir/ocean-release.jks")
            storePassword System.getenv('OCEAN_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('OCEAN_KEY_ALIAS') ?: ''
            keyPassword System.getenv('OCEAN_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
