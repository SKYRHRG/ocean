<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: http:; img-src 'self' data:"
    />
    <title>OCEAN</title>
    <style>
      :root {
        --bg0: #e4f0fc;
        --bg1: #d8f0fc;
        --line: #87cefa;
        --ink: #111111;
        --muted: #2e4053;
        --accent: #00a0f8;
        --accent2: #00b8f8;
        --accent-deep: #0088f8;
        --title0: #0245ae;
        --title1: #0070de;
        --quit: #2c333d;
        --danger: #ef4444;
        --ok: #16a34a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        font: 12px/1.35 "Segoe UI", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, var(--bg0), var(--bg1));
        overflow: hidden;
      }
      body {
        padding: 14px 14px 14px;
        -webkit-app-region: drag;
      }
      .card {
        -webkit-app-region: no-drag;
      }
      .brand {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-align: center;
        margin: 0 0 10px;
        background: linear-gradient(180deg, var(--title0), var(--title1));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      label {
        display: block;
        margin: 0 0 4px;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: #eaf7ff;
        color: var(--ink);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 12px;
        outline: none;
        box-shadow: 0 0 0 1px rgba(74, 179, 255, 0.35), 0 0 10px rgba(0, 180, 252, 0.25);
      }
      input:focus {
        border-color: #4ab3ff;
        box-shadow: 0 0 0 1px rgba(74, 179, 255, 0.55), 0 0 14px rgba(0, 180, 252, 0.4);
      }
      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .status {
        margin: 6px 0 0;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        line-height: 1.3;
      }
      .status:empty {
        display: none;
      }
      .status.is-err { color: var(--danger); }
      .status.is-ok { color: var(--ok); }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        border: none;
        border-radius: 6px;
        padding: 9px 10px;
        font-weight: 800;
        font-size: 12px;
        cursor: pointer;
      }
      .btn-go {
        background: linear-gradient(180deg, var(--accent2), var(--accent-deep));
        color: #ffffff;
        box-shadow: 0 0 12px rgba(0, 160, 248, 0.45);
      }
      .btn-go:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .btn-quit {
        flex: 0.42;
        background: var(--quit);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">OCEAN</div>

      <label for="licKey">License key</label>
      <input id="licKey" type="text" autocomplete="off" spellcheck="false" placeholder="Enter license key" />

      <input id="licMac" class="visually-hidden" type="text" readonly tabindex="-1" aria-hidden="true" />

      <div id="status" class="status"></div>

      <div class="actions">
        <button type="button" class="btn-quit" id="btnQuit">Quit</button>
        <button type="button" class="btn-go" id="btnActivate">Activate</button>
      </div>
    </div>
    <script src="./license.js"></script>
  </body>
</html>
